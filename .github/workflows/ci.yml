name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Check committed whitespace
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --check "${{ github.event.before }}"..HEAD
          else
            git diff --check HEAD
          fi
      - name: Lint
        run: python -m ruff check git_crawl tests
      - name: Compile package
        run: python -m compileall -q git_crawl
      - name: Run tests
        run: python -m pytest tests -q
