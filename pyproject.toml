[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-crawl"
version = "0.3.1"
description = "Crawl GitHub repositories and organizations into structured Git contribution metrics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Alex Desroches"}]
keywords = ["git", "github", "crawler", "metrics", "analytics", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alex-drocks/git-crawl"
Repository = "https://github.com/alex-drocks/git-crawl"
Issues = "https://github.com/alex-drocks/git-crawl/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
git-crawl = "git_crawl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.setuptools.packages.find]
include = ["git_crawl*"]
